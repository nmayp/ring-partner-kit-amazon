[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ring-partner-kit"
version = "0.1.0"
description = "Typed async client, webhook verification, account-linking helpers and a signed-event simulator for the Ring Partner (Amazon Vision) API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]
keywords = ["ring", "doorbell", "amazon", "webhooks", "oauth", "smart-home"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: AsyncIO",
  "Topic :: Home Automation",
  "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ring-webhook-sim = "ring_partner_kit.simulator:main"

[tool.hatch.build.targets.wheel]
packages = ["ring_partner_kit"]
